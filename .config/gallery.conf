# .config/gallery.conf
# Service-specific configuration for GALLERY on uwanda

SERVICE_NAME="gallery"
SERVICE_DISPLAY_NAME="GALLERY"

# System user, group, and systemd unit
SERVICE_USER="gallery"
SERVICE_GROUP="gallery_media"
UNIT_NAME="gallery.service"

# Application filesystem paths
SERVICE_HOME="/home/gallery"
APP_DIR="${SERVICE_HOME}/app"
PUBLIC_DIR="${APP_DIR}/public"
ENV_FILE="${SERVICE_HOME}/config/gallery.env"
DB_PATH="${SERVICE_HOME}/data/production.sqlite3"
BACKUP_DIR="${SERVICE_HOME}/backups"
BACKUP_PREFIX="production"
BACKUP_RETENTION=10

# Git & Ruby runtime
GIT_REMOTE="origin"
GIT_BRANCH="main"
RUBY_WRAPPER_DIR="/usr/local/rvm/wrappers/ruby-3.3.11"
BUNDLE_WITHOUT="development test"
BUNDLE_JOBS=4
VERSION_CONST="Gallery::VERSION"

# HTTP health check & Nginx maintenance mode
BIND_URL="http://127.0.0.1:9000"
HEALTH_PATH="/up"
HEALTH_EXPECTED_CODE="200"
HEALTH_TIMEOUT=15
HEALTH_INTERVAL=1
NGINX_SITE_CONF="/etc/nginx/sites-available/gallery.conf"
MAINTENANCE_FLAG="${APP_DIR}/tmp/maintenance.flag"
MAINTENANCE_HTML="${PUBLIC_DIR}/maintenance.html"

# Isolated test suite runner
TEST_FIXTURE_DB="${BACKUP_DIR}/test_fixture.sqlite3"
TEST_TEMP_DB="/tmp/gallery_suite_test.sqlite3"
TEST_RUNNER="./script/run_all_tests.sh"

