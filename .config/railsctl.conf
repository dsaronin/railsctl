# .config/railsctl.conf
# Global configuration for railsctl lifecycle and deployment suite

RAILSCTL_VERSION="1.0.0"
RAILSCTL_ROOT="${RAILSCTL_ROOT:-${HOME}/railsctl}"
RAILSCTL_COMMANDS_DIR="${RAILSCTL_ROOT}/bin/railsctl.d"
RAILSCTL_CONFIG_DIR="${RAILSCTL_ROOT}/.config"
RAILSCTL_SERVICES_DIR="${RAILSCTL_ROOT}/services"

# Default operational settings (overridable per service)
DEFAULT_HEALTH_TIMEOUT=15
DEFAULT_HEALTH_INTERVAL=1
DEFAULT_JOURNAL_LINES=40
DEFAULT_BACKUP_RETENTION=10
